<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${article.title} + ' - NewsBoard'">Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
    <style>
        body {
            background-color: #f5f7fa;
        }

        .article-container {
            max-width: 850px;
            margin: 0 auto;
            padding: 2rem 1rem;
        }

        .article-header {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            margin-bottom: 1.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
        }

        .article-content {
            background: white;
            border-radius: 16px;
            padding: 2.5rem;
            box-shadow: 0 2px 8px rgba(0,0,0,0.06);
            font-size: 1.05rem;
            line-height: 1.8;
            color: #333;
        }

        .article-content p {
            margin-bottom: 1.25rem;
        }

        .back-link {
            display: inline-flex;
            align-items: center;
            color: #555;
            text-decoration: none;
            font-weight: 500;
            margin-bottom: 1.5rem;
            transition: color 0.2s;
        }

        .back-link:hover {
            color: #0d6efd;
        }

        .meta-badge {
            display: inline-flex;
            align-items: center;
            background: #f0f2f5;
            padding: 0.4rem 0.8rem;
            border-radius: 8px;
            font-size: 0.85rem;
            color: #555;
            margin-right: 0.75rem;
            margin-bottom: 0.5rem;
        }

        .source-link {
            display: inline-flex;
            align-items: center;
            background: #0d6efd;
            color: white;
            padding: 0.6rem 1.25rem;
            border-radius: 8px;
            text-decoration: none;
            font-weight: 500;
            transition: background 0.2s;
            margin-top: 1.5rem;
        }

        .source-link:hover {
            background: #0b5ed7;
            color: white;
        }
    </style>
</head>
<body>

<div class="article-container">

    <!-- Back button -->
    <a href="/" class="back-link">
        <i class="bi bi-arrow-left me-2"></i> Back to Dashboard
    </a>

    <!-- Article Header -->
    <div class="article-header">
        <h1 class="display-6 fw-bold mb-3" th:text="${article.title}">Article Title</h1>

        <div class="d-flex flex-wrap align-items-center mt-3">
            <span class="meta-badge">
                <i class="bi bi-building me-1"></i>
                <span th:text="${article.src.name}">Source</span>
            </span>
            <span class="meta-badge">
                <i class="bi bi-person me-1"></i>
                <span th:text="${article.author}">Author</span>
            </span>
            <span class="meta-badge">
                <i class="bi bi-calendar me-1"></i>
                <span th:text="${#temporals.format(article.publishedAt, 'dd MMMM yyyy HH:mm')}">Date</span>
            </span>
        </div>
    </div>

    <!-- Article Content -->
    <div class="article-content">
        <!-- Show content with line breaks preserved -->
        <div th:utext="${article.content}">
            Content goes here...
        </div>

        <!-- Original source link -->
        <a th:href="${article.url}" target="_blank" rel="noopener noreferrer" class="source-link">
            <i class="bi bi-box-arrow-up-right me-2"></i>
            Read original article on <span th:text="${article.src.name}" class="ms-1 fw-bold">Source</span>
        </a>
    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
